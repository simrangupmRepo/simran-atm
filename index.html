<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="atm-container">
    <div class="atm-machine">
      <h1>🏧 ATM Management System</h1>
      <p class="subtitle">Deposit • Withdraw • Balance Inquiry</p>

      <div id="balance-display" class="balance-display">
        Current Balance: <span id="balance-amount">₹0</span>
      </div>

      <div class="atm-actions">
        <div class="action-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" min="0" placeholder="Enter amount">
          <span id="amount-error" class="error-msg"></span>
        </div>

        <div class="button-group">
          <button id="deposit-btn" class="btn btn-deposit">Deposit</button>
          <button id="withdraw-btn" class="btn btn-withdraw">Withdraw</button>
          <button id="balance-btn" class="btn btn-balance">Balance Inquiry</button>
        </div>
      </div>

      <div id="message" class="message"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
